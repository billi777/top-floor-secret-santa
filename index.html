<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071f35">
  <title>Top Floor Secret Santa</title>
  <style>
    :root{--navy:#071f35;--red:#d7193f;--gold:#f4cc55;--cream:#fff9ee;--green:#64c997}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden;background:var(--navy);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--cream)}
    button,input{font:inherit}button{cursor:pointer}.app{position:relative;min-height:100dvh;overflow-x:hidden}.snowbox{pointer-events:none;position:fixed;inset:0;z-index:0;height:100dvh;width:100vw;overflow:hidden;contain:strict}.flake{position:absolute;top:-34px;color:rgba(255,255,255,.16);animation:snow linear infinite}
    @keyframes snow{from{transform:translateY(-40px) rotate(0)}to{transform:translateY(calc(100dvh + 80px)) rotate(270deg)}}@keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}@keyframes bunnyDrop{from{transform:translateY(-110px) rotate(180deg);opacity:0}to{transform:translateY(0) rotate(180deg);opacity:1}}@keyframes nameOut{0%,35%{transform:translate(-50%,55px);opacity:0}100%{transform:translate(-50%,0);opacity:1}}
    header{position:relative;z-index:2;border-bottom:1px solid rgba(255,255,255,.1);background:rgba(7,31,53,.92);padding:16px}.head{max-width:900px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:900}.pill{flex:none;border-radius:999px;background:rgba(255,255,255,.06);padding:7px 12px;font-size:12px}
    main{position:relative;z-index:1;max-width:900px;min-height:calc(100dvh - 65px);margin:auto;display:flex;align-items:center;justify-content:center;padding:22px}.view{width:100%;max-width:680px;text-align:center;animation:pop .35s ease-out}.iconbox{width:96px;height:96px;margin:0 auto 20px;border-radius:24px;background:var(--red);display:grid;place-items:center;font-size:48px}.eyebrow{color:var(--gold);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.2em}.hero{font-size:clamp(48px,10vw,74px);line-height:.95;margin:16px 0 0;font-weight:950}.hero span{color:var(--gold)}p{line-height:1.55}.muted{color:rgba(255,255,255,.68)}.btn{border:0;border-radius:16px;padding:15px 24px;font-weight:900}.primary{background:var(--red);color:white}.gold{background:var(--gold);color:var(--navy)}.ghost{background:transparent;color:rgba(255,255,255,.65)}.wide{width:100%}.progress{margin-top:12px;color:rgba(255,255,255,.5);font-size:14px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:24px}.person{min-height:100px;border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:15px;text-align:left;background:rgba(255,255,255,.08);color:white}.person.seen{border-color:rgba(100,201,151,.35);background:rgba(100,201,151,.1)}.person-top{display:flex;align-items:center;justify-content:space-between}.status{font-size:11px}.name{margin-top:14px;font-size:18px;font-weight:900}
    .bunny-stage{position:relative;height:265px;max-width:380px;margin:auto;overflow:hidden;padding-top:16px}.result-name{position:absolute;left:50%;top:55px;z-index:0;white-space:nowrap;border:2px solid var(--gold);border-radius:16px;background:var(--cream);padding:12px 28px;color:var(--navy);font-size:clamp(34px,10vw,52px);font-weight:950;box-shadow:0 15px 40px rgba(0,0,0,.35);animation:nameOut 1.25s ease-out both}.bunny{position:relative;z-index:1;width:176px;margin:82px auto 0;transform:rotate(180deg);animation:bunnyDrop 1s ease-out both}.ear{position:absolute;top:2px;width:48px;height:96px;border:4px solid #e8e1d6;border-radius:75% 75% 45% 45%;background:white}.ear:after{content:"";display:block;width:20px;height:56px;margin:16px auto;border-radius:999px;background:#f2b5be}.ear.left{left:-4px;transform:rotate(-12deg)}.ear.right{right:-4px;transform:rotate(12deg)}.face{position:relative;top:56px;width:160px;height:128px;margin:auto;border:4px solid #e8e1d6;border-radius:48% 48% 52% 52%;background:white;box-shadow:0 12px 28px rgba(0,0,0,.25)}.eye{position:absolute;top:48px;width:12px;height:12px;border-radius:50%;background:var(--navy)}.eye.left{left:32px}.eye.right{right:32px}.nose{position:absolute;left:50%;top:68px;width:20px;height:16px;transform:translateX(-50%);border-radius:50%;background:#ef8fa0}.info{border-radius:14px;background:rgba(255,255,255,.06);padding:13px;color:var(--gold);font-weight:800}
    .modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.76)}.modal-card{width:100%;max-width:360px;border-radius:24px;background:var(--cream);padding:24px;color:var(--navy);text-align:left}.pin{width:100%;margin-top:16px;border:1px solid #ccc;border-radius:12px;padding:13px;text-align:center;font-size:22px;font-weight:900;letter-spacing:.3em}.error{color:var(--red);font-weight:800;font-size:14px}.hidden{display:none!important}.admin{position:fixed;right:10px;bottom:10px;z-index:3;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.45);padding:8px 11px;font-size:11px}
    @media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  </style>
</head>
<body>
<div class="app">
  <div class="snowbox" aria-hidden="true" id="snow"></div>
  <header><div class="head"><div>🎁 Top Floor Secret Santa</div><div class="pill">£10 · 7 Dec</div></div></header>
  <main id="main"></main>
  <button class="admin" id="resetBtn">Organiser reset</button>
  <div id="modal"></div>
</div>
<script>
const PIN='2512';
const STORAGE_KEY='top-floor-secret-santa-github-test-v1';
const PEOPLE=['Bilal','Richard','Kate','Lennon','Bianca','Carrie','Chris','Sarnia','Cat F','Nicola','Phil','Adam'];
let saved=load();
let state=saved?{matches:saved.matches,done:saved.done||[],screen:'welcome',chosen:null,revealed:false}:{matches:null,done:[],screen:'welcome',chosen:null,revealed:false};
function load(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))}catch(e){return null}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify({matches:state.matches,done:state.done}))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeDraw(names){const order=shuffle(names),used=new Set(),result={};function solve(i){if(i===order.length)return true;const giver=order[i];for(const r of shuffle(names.filter(n=>n!==giver&&!used.has(n)))){used.add(r);result[giver]=r;if(solve(i+1))return true;used.delete(r);delete result[giver]}return false}return solve(0)?result:null}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function welcome(){return `<section class="view"><div class="iconbox">🎁</div><div class="eyebrow">The top floor has been suspiciously nice lately...</div><h1 class="hero">Top Floor<br><span>Secret Santa</span></h1><p class="muted">£10. No peeking. No swapping. No mysteriously buying yourself exactly what you wanted.</p><p><strong>Gifts exchanged on 7 December 🎄</strong></p><button class="btn primary" onclick="continueDraw()">${state.matches?'🎁 Next person':'🎁 Start the draw'}</button>${state.matches?`<div class="progress">${state.done.length} of ${PEOPLE.length} people have revealed</div>`:''}</section>`}
function choose(){return `<section class="view"><div class="eyebrow">Pass the device</div><h2>Who's holding it now?</h2><p class="muted">Choose your name. Seen means the result has already been viewed.</p><div class="grid">${PEOPLE.map(n=>{const seen=state.done.includes(n);return `<button class="person ${seen?'seen':''}" onclick="choosePerson('${n.replace(/'/g,"\\'")}')"><div class="person-top"><span>${seen?'✅':'🎁'}</span><span class="status">${seen?'Seen ✓':'Ready'}</span></div><div class="name">${esc(n)}</div></button>`}).join('')}</div></section>`}
function confirmView(){if(!state.revealed)return `<section class="view" style="max-width:430px"><h2>Are you ${esc(state.chosen)}?</h2><p class="muted">Make sure nobody else can see the screen.</p><button class="btn gold wide" onclick="reveal()">Yes · reveal my Secret Santa</button><button class="btn ghost wide" onclick="backToNames()">No, go back</button></section>`;const r=state.matches[state.chosen];return `<section class="view" style="max-width:430px"><div class="eyebrow">${esc(state.chosen)}, you are buying for...</div><div class="bunny-stage"><div class="result-name">${esc(r)}</div><div class="bunny"><div class="ear left"></div><div class="ear right"></div><div class="face"><i class="eye left"></i><i class="eye right"></i><i class="nose"></i></div></div></div><div class="info">Maximum spend: £10 · 7 December</div><button class="btn primary wide" style="margin-top:18px" onclick="hideAndPass()">Hide result & pass it on</button></section>`}
function complete(){return `<section class="view"><div style="font-size:72px">🎉</div><h1>Secret Santa complete!</h1><div class="info" style="font-size:22px;padding:24px">See you on 7 December! 🎄</div></section>`}
function render(){document.getElementById('main').innerHTML=state.screen==='welcome'?welcome():state.screen==='choose'?choose():state.screen==='confirm'?confirmView():complete()}
function continueDraw(){if(!state.matches){state.matches=makeDraw(PEOPLE);state.done=[];save()}state.screen=state.done.length===PEOPLE.length?'complete':'choose';render()}
function choosePerson(name){if(state.done.includes(name)){openPin(name,false);return}state.chosen=name;state.revealed=false;state.screen='confirm';render()}
function reveal(){state.revealed=true;render()}
function backToNames(){state.chosen=null;state.revealed=false;state.screen='choose';render()}
function hideAndPass(){if(!state.done.includes(state.chosen))state.done.push(state.chosen);save();state.chosen=null;state.revealed=false;state.screen=state.done.length===PEOPLE.length?'complete':'welcome';render()}
function openPin(name,isReset){const m=document.getElementById('modal');m.innerHTML=`<div class="modal"><div class="modal-card"><div style="font-size:28px">🔐</div><h3>${isReset?'Reset the draw?':'Already revealed'}</h3><p>${isReset?'This permanently removes the saved test draw and Seen progress.':esc(name)+' has already viewed the result. Enter the organiser PIN to reopen it.'}</p><input class="pin" id="pin" inputmode="numeric" maxlength="4" placeholder="PIN"><p class="error hidden" id="pinerr">That PIN isn't right.</p><button class="btn primary wide" style="margin-top:12px" id="pinok">${isReset?'Reset draw':'Unlock'}</button><button class="btn wide" onclick="closeModal()">Cancel</button></div></div>`;m.dataset.name=name||'';m.dataset.reset=isReset?'1':'0';document.getElementById('pinok').onclick=checkPin;setTimeout(()=>document.getElementById('pin').focus(),50)}
function checkPin(){if(document.getElementById('pin').value!==PIN){document.getElementById('pinerr').classList.remove('hidden');return}const m=document.getElementById('modal');if(m.dataset.reset==='1'){localStorage.removeItem(STORAGE_KEY);state={matches:null,done:[],screen:'welcome',chosen:null,revealed:false};closeModal();render()}else{state.chosen=m.dataset.name;state.revealed=true;state.screen='confirm';closeModal();render()}}
function closeModal(){document.getElementById('modal').innerHTML=''}
document.getElementById('resetBtn').onclick=()=>openPin('',true);
[7,18,31,46,61,75,88,96].forEach((x,i)=>{const f=document.createElement('span');f.className='flake';f.textContent='❄';f.style.left=x+'%';f.style.fontSize=(13+(i%3)*7)+'px';f.style.animationDuration=(8+i%4)+'s';f.style.animationDelay=(-i*1.7)+'s';document.getElementById('snow').appendChild(f)});
render();
</script>
</body>
</html>
